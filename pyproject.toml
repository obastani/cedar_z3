[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar-z3"
version = "0.2.0"
description = "Schema-relative Cedar policy implication using cedarpy and Z3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cedarpy==4.12.2", "z3-solver==5.3.1.0"]

[tool.setuptools.packages.find]
include = ["cedar_z3*"]
